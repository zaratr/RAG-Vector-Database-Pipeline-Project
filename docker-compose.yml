services:
  migrate:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_CONTEXT_SHA256: ${SOURCE_CONTEXT_SHA256:-unknown}
        SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-sqlite:////data/rag.db}
    volumes:
      - relational_data:/data
    command: ["python", "-m", "app.core.migrations"]
    restart: "no"
  api:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_CONTEXT_SHA256: ${SOURCE_CONTEXT_SHA256:-unknown}
        SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-sqlite:////data/rag.db}
      RAG_EXTRACTION_LEASE_SECONDS: ${RAG_EXTRACTION_LEASE_SECONDS:-600}
    volumes:
      - relational_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      vectordb:
        condition: service_healthy
    restart: unless-stopped
  vectordb:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
volumes:
  chroma_data:
  relational_data:
