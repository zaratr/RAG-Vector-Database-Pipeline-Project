services:
  migrate:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_CONTEXT_SHA256: ${SOURCE_CONTEXT_SHA256:-unknown}
        SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-sqlite:////data/rag.db}
    volumes:
      - relational_data:/data
    command: ["python", "-m", "app.core.migrations"]
    restart: "no"
  api:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_CONTEXT_SHA256: ${SOURCE_CONTEXT_SHA256:-unknown}
        SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-sqlite:////data/rag.db}
      RAG_EXTRACTION_LEASE_SECONDS: ${RAG_EXTRACTION_LEASE_SECONDS:-600}
      RAG_SOURCE_TRUST_POLICY_PATH: ${RAG_SOURCE_TRUST_POLICY_PATH:-/app/config/source-trust-policy.json}
      RAG_OPERATOR_API_ENABLED: ${RAG_OPERATOR_API_ENABLED:-false}
      RAG_OPERATOR_TOKEN: ${RAG_OPERATOR_TOKEN:-}
      RAG_SECURITY_AUDIT_RETENTION_DAYS: ${RAG_SECURITY_AUDIT_RETENTION_DAYS:-30}
      RAG_RETRIEVAL_SECURITY_POLICY_PATH: ${RAG_RETRIEVAL_SECURITY_POLICY_PATH:-/app/config/retrieval-security-policy.json}
      RAG_CONTEXT_SECURITY_POLICY_PATH: ${RAG_CONTEXT_SECURITY_POLICY_PATH:-/app/config/context-security-policy.json}
      RAG_INGESTION_REQUEST_MAX_BYTES: ${RAG_INGESTION_REQUEST_MAX_BYTES:-11534336}
      RAG_INGESTION_FILE_MAX_BYTES: ${RAG_INGESTION_FILE_MAX_BYTES:-10485760}
      RAG_INGESTION_EXTRACTED_MAX_BYTES: ${RAG_INGESTION_EXTRACTED_MAX_BYTES:-5242880}
      RAG_INGEST_RATE_LIMIT_REQUESTS: ${RAG_INGEST_RATE_LIMIT_REQUESTS:-30}
      RAG_INGEST_RATE_LIMIT_WINDOW_SECONDS: ${RAG_INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_CONTENT_SAFETY_ENABLED: ${RAG_CONTENT_SAFETY_ENABLED:-false}
      RAG_CONTENT_SAFETY_POLICY_PATH: ${RAG_CONTENT_SAFETY_POLICY_PATH:-/app/config/content-safety-policy.json}
      RAG_SAFETY_LLM_MODE: ${RAG_SAFETY_LLM_MODE:-disabled}
    volumes:
      - relational_data:/data
      # Named volume for the fastembed model cache (fastembed 0.8 caches the
      # ~500MB jina-clip-v1 model at /tmp/fastembed_cache in-container) so
      # `docker compose up --force-recreate` reuses the downloaded model
      # instead of re-downloading it on every recreate. First populate is a
      # one-time download into the volume.
      - fastembed_cache:/tmp/fastembed_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      vectordb:
        condition: service_healthy
    restart: unless-stopped
  vectordb:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
volumes:
  chroma_data:
  relational_data:
  fastembed_cache:
